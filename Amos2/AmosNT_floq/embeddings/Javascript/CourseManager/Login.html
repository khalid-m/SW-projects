<html>
    <head>
        <script type="text/javascript" src="scripts/SOAPClient.js"></script>
        <script type="text/javascript" src="scripts/cookies.js"></script>
        <script  type="text/javascript" language="javascript">
            var error,username,password,coursename;
            var oMyObject = window.dialogArguments;
            var cname = oMyObject.selectedCourse;
            
            function btnLogin_onclick() {
                error = null;
                document.getElementById("invalidDiv").style.display='none';
                username = document.getElementById("txt_name").value;
                password = document.getElementById("txt_pwd").value;
                if(username == "" || password == ""){
                    document.getElementById("invalidDiv").style.display='block';
                }else{
                    SOAPClient.invoke("LOGIN", [username,password,cname], true, btnLogin_callBack, error_callBack);
                }
            }

            function btnLogin_callBack(o, xmlDoc)
            {
                if (o != null && o != "" && o != 'none'){
                    setCookie("name",username);
                    returnValue=o;
                    window.close();
                }else if(o== null || o == "none"){
                    document.getElementById("invalidDiv").style.display='block';
                    document.getElementById("txt_pwd").value = "";
                    document.getElementById("txt_name").focus();
                }
            }

            function error_callBack(e, errorCode){
                if (e != null && errorCode != null){
                    error = e;
                    document.getElementById("rDiv").style.display='none';
                    document.getElementById("eDiv").innerHTML="Error callBack:<br>" + error + "<br><br>Error code:<br>" + errorCode;
                }
            }

            function window_onload(){
                document.getElementById("txt_name").onfocus;
            }
        </script>
    </head>
    <body onload="return window_onload();">
        <div id="rDiv" style="display:block;">
            <table width="100%" border="0" cellspacing="0">
                <tr>
                    <td>Username:</td>
                    <td><input type="text" size="15" id="txt_name"></td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password" size="15" id="txt_pwd"></td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                    <td><input type="button" value="log in" name="login" onclick="return btnLogin_onclick();"></td>
                </tr>
            </table>
            <div id="invalidDiv" style="display:none;"><font color="red">Invalid username or password.</font></div>
            If you do not already have an account, please register as a new user.
        </div>
        <div id="eDiv"></div>
    </body>
</html>
